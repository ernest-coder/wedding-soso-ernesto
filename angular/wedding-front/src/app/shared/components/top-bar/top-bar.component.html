<header class="w-full bg-white shadow-sm">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <!-- Logo/Title -->
      <a href="/" class="text-xl font-bold text-gray-800 hover:text-gray-600">
        Mariage Solène & Ernest
      </a>
  
      <!-- Desktop Menu -->
      <nav class="hidden md:flex space-x-6">
        <a href="/dress-code" class="text-gray-600 hover:text-gray-800">Dress code</a>
        <a href="/jeu" class="text-gray-600 hover:text-gray-800">Jeu</a>
        <a href="/liste-de-mariage" class="text-gray-600 hover:text-gray-800">Liste de mariage</a>
        <a href="/programme" class="text-gray-600 hover:text-gray-800">Programme</a>
        <a href="/rsvp" class="text-gray-600 hover:text-gray-800">RSVP</a>
        <a href="/" class="text-gray-600 hover:text-gray-800">Solène & Ernest</a>
        <a href="/voyage-et-sejour" class="text-gray-600 hover:text-gray-800">Voyage et Séjour</a>
      </nav>
  
      <!-- Mobile Menu Button -->
      <button
        (click)="toggleMenu()"
        class="md:hidden p-2 text-gray-600 hover:text-gray-800 focus:outline-none"
        aria-label="Toggle menu"
      >
        <svg *ngIf="!isMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <svg *ngIf="isMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  
    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen" class="md:hidden bg-white shadow-lg absolute w-full z-10">
      <div class="container mx-auto px-4 py-2 flex flex-col space-y-2">
        <a href="/dress-code" class="py-2 text-gray-600 hover:text-gray-800">Dress code</a>
        <a href="/jeu" class="py-2 text-gray-600 hover:text-gray-800">Jeu</a>
        <a href="/liste-de-mariage" class="py-2 text-gray-600 hover:text-gray-800">Liste de mariage</a>
        <a href="/programme" class="py-2 text-gray-600 hover:text-gray-800">Programme</a>
        <a href="/rsvp" class="py-2 text-gray-600 hover:text-gray-800">RSVP</a>
        <a href="/" class="py-2 text-gray-600 hover:text-gray-800">Solène & Ernest</a>
        <a href="/voyage-et-sejour" class="py-2 text-gray-600 hover:text-gray-800">Voyage et Séjour</a>
      </div>
    </div>
</header>
